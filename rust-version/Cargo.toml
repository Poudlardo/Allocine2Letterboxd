[package]
name = "allocine2letterboxd"
version = "0.1.0"
edition = "2021"
authors = ["Poudlardo"]
description = "Export Allocine films and reviews to CSV for Letterboxd import"

[dependencies]
# HTTP client with rustls (pure Rust TLS, no OpenSSL dependency)
reqwest = { version = "0.13", features = ["json", "cookies", "gzip", "rustls"], default-features = false }

# HTML parsing
scraper = "0.27"

# CSV export
csv = "1.4"

# Serialization for CSV
serde = { version = "1.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# For handling retries and backoff
backoff = { version = "0.4", features = ["tokio"] }

# For URL manipulation
url = "2.5"

# For text normalization (removing accents)
unicode-normalization = "0.1"

# For regex matching
regex = "1.13"

# For progress bars
indicatif = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
